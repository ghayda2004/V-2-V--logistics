
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Simulation Gains Chart</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background:#f7f7f9; color:#1f2937; }
    h2 { margin-bottom: 6px; }
    p { color:#4b5563; }
    .card { background:white; border:1px solid #e5e7eb; border-radius:10px; padding:16px; max-width:920px; }
    .row { display:grid; grid-template-columns: 160px 1fr 120px; gap:10px; align-items:center; margin:10px 0; }
    .label { font-weight:600; }
    .bar-wrap { background:#eef2f7; border-radius:6px; height:18px; overflow:hidden; }
    .bar { height:100%; border-radius:6px; }
    .val { text-align:right; font-family: monospace; }
  </style>
</head>
<body>
  <h2>Gains vs Baseline (Total Cost Saved)</h2>
  <p>Positive = saving, Negative = more expensive than baseline.</p>
  <div class="card">
            <div class="row">
              <div class="label">1_car</div>
              <div class="bar-wrap"><div class="bar" style="width:0%;background:#2a9d8f;"></div></div>
              <div class="val">0.00</div>
            </div>
            
            <div class="row">
              <div class="label">2_cars_forced</div>
              <div class="bar-wrap"><div class="bar" style="width:79%;background:#e63946;"></div></div>
              <div class="val">-5.16</div>
            </div>
            
            <div class="row">
              <div class="label">3_cars_forced</div>
              <div class="bar-wrap"><div class="bar" style="width:36%;background:#e63946;"></div></div>
              <div class="val">-2.35</div>
            </div>
            
            <div class="row">
              <div class="label">5_cars_forced</div>
              <div class="bar-wrap"><div class="bar" style="width:100%;background:#e63946;"></div></div>
              <div class="val">-6.52</div>
            </div>
            </div>
</body>
</html>
